# ==============================================================================
# Hostvra Platform — Production Docker Compose
# ==============================================================================
# Usage:
#   cp .env.example .env    # Edit with your production values
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hostvra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hostvra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hostvra_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-hostvra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hostvra} -d ${POSTGRES_DB:-hostvra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hostvra-internal

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hostvra-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hostvra-internal

  # ── Go API Server ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hostvra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://${POSTGRES_USER:-hostvra}:${POSTGRES_PASSWORD:-hostvra_prod_password}@postgres:5432/${POSTGRES_DB:-hostvra}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost/api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hostvra.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      # SMTP (Transactional Email)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@hostvra.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Hostvra}
      # Domain Reseller
      DOMAIN_REGISTRAR: ${DOMAIN_REGISTRAR:-resellerclub}
      RESELLERCLUB_MODE: ${RESELLERCLUB_MODE:-sandbox}
      RESELLERCLUB_RESELLER_ID: ${RESELLERCLUB_RESELLER_ID:-}
      RESELLERCLUB_API_KEY: ${RESELLERCLUB_API_KEY:-}
      DOMAIN_DEFAULT_NS1: ${DOMAIN_DEFAULT_NS1:-ns1.hostvra.com}
      DOMAIN_DEFAULT_NS2: ${DOMAIN_DEFAULT_NS2:-ns2.hostvra.com}
      DOMAIN_ENCRYPTION_SECRET: ${DOMAIN_ENCRYPTION_SECRET:-}
    volumes:
      - api_data:/var/lib/hostvra
    networks:
      - hostvra-internal

  # ── Next.js Web Dashboard ──────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost/api}
    container_name: hostvra-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      INTERNAL_API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost/api}
    networks:
      - hostvra-internal

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: hostvra-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - ./certs:/etc/nginx/ssl:ro
    networks:
      - hostvra-internal

volumes:
  postgres_data:
  redis_data:
  api_data:

networks:
  hostvra-internal:
    driver: bridge
